    <script>
    // Sync to the site's theme when embedded (ToolFrame posts `poli-theme`).
    //
    // The inner React bundle owns dark mode itself: it seeds its state from
    // localStorage["poli-dark-mode"] (default "dark") at mount and drives the
    // `.dark` class on <html> from that state via a useEffect. Its own toggle
    // lives in a header that this wrapper hides, so we cannot click it. Instead
    // we (a) SEED localStorage from the parent theme synchronously, before the
    // deferred module runs, so the first render matches with no flash, and
    // (b) on a later theme change, reload the iframe (only if it differs) so the
    // app re-reads the seed. The app auto-saves form state, so a reload is safe.
    if (window.self !== window.top) {
        var poliRoot = document.documentElement;
        var POLI_LS_KEY = 'poli-dark-mode';

        var poliSeed = function (light) {
            try { localStorage.setItem(POLI_LS_KEY, light ? 'light' : 'dark'); } catch (e) {}
        };
        var poliApplyChrome = function (light) {
            poliRoot.setAttribute('data-theme', light ? 'light' : 'dark');
            poliRoot.classList.toggle('dark', !light);
            var b = document.body;
            if (b) {
                b.classList.toggle('dark-mode', !light);
                b.classList.toggle('light-mode', !!light);
            }
        };

        // Read the parent's theme synchronously (same-origin) so we can seed
        // BEFORE the React bundle initialises its state. Falls back to dark.
        var initialLight = false;
        try {
            initialLight = window.top.document.documentElement.classList.contains('light-mode');
        } catch (e) {}
        poliSeed(initialLight);
        poliApplyChrome(initialLight);
        document.addEventListener('DOMContentLoaded', function () {
            poliApplyChrome(poliRoot.getAttribute('data-theme') === 'light');
        });

        window.addEventListener('message', function (e) {
            if (!e.data || e.data.type !== 'poli-theme') return;
            var light = !!e.data.light;
            var wantsDark = !light;
            // The React app persists the theme it is CURRENTLY showing to this
            // localStorage key (via its useEffect), so read it before we re-seed.
            var prev = null;
            try { prev = localStorage.getItem(POLI_LS_KEY); } catch (err) {}
            var currentlyDark = (prev === null) ? true : (prev === 'dark');
            poliSeed(light);
            poliApplyChrome(light);
            if (currentlyDark !== wantsDark) {
                // Re-mount the app so it re-reads the freshly seeded theme.
                window.location.reload();
            }
        });
    }
    </script>
