  <script>
    // Sync to the site's theme when embedded (ToolFrame posts `poli-theme`).
    if (window.self !== window.top) {
      var poliRoot = document.documentElement;
      var POLI_LS_KEY = 'poli-dark-mode';
      var poliSeed = function (light) {
        try { localStorage.setItem(POLI_LS_KEY, light ? 'light' : 'dark'); } catch (e) {}
      };
      var poliApplyChrome = function (light) {
        poliRoot.setAttribute('data-theme', light ? 'light' : 'dark');
        poliRoot.classList.toggle('dark', !light);
        var b = document.body;
        if (b) {
          b.classList.toggle('dark-mode', !light);
          b.classList.toggle('light-mode', !!light);
        }
      };
      var initialLight = false;
      try {
        initialLight = window.top.document.documentElement.classList.contains('light-mode');
      } catch (e) {}
      poliSeed(initialLight);
      poliApplyChrome(initialLight);
      document.addEventListener('DOMContentLoaded', function () {
        poliApplyChrome(poliRoot.getAttribute('data-theme') === 'light');
      });
      window.addEventListener('message', function (e) {
        if (!e.data || e.data.type !== 'poli-theme') return;
        var light = !!e.data.light;
        var wantsDark = !light;
        var prev = null;
        try { prev = localStorage.getItem(POLI_LS_KEY); } catch (err) {}
        var currentlyDark = (prev === null) ? true : (prev === 'dark');
        poliSeed(light);
        poliApplyChrome(light);
        if (currentlyDark !== wantsDark) {
          window.location.reload();
        }
      });
    }
  </script>
