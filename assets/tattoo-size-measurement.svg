<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 281" width="500" height="281" role="img" aria-label="Measuring the width and height of a tattoo with a ruler on a forearm">
  <defs>
    <linearGradient id="szbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef3fa"/>
    </linearGradient>
  </defs>
  <rect width="500" height="281" rx="14" fill="url(#szbg)"/>
  <rect x="0.5" y="0.5" width="499" height="280" rx="13.5" fill="none" stroke="#dbe4f0"/>

  <text x="40" y="42" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#3b82f6">STEP 1</text>
  <text x="460" y="42" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Set the size</text>

  <!-- dimension arrows -->
  <g stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round">
    <line x1="80" y1="82" x2="420" y2="82"/>
    <path d="M80 82 l10 -6 M80 82 l10 6"/>
    <path d="M420 82 l-10 -6 M420 82 l-10 6"/>
  </g>
  <text x="250" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Width &#215; Height</text>

  <!-- ruler -->
  <g>
    <rect x="80" y="104" width="340" height="34" rx="6" fill="#3b82f6"/>
    <rect x="80" y="104" width="340" height="34" rx="6" fill="none" stroke="#2563eb"/>
    <g stroke="#ffffff" stroke-width="2">
      <line x1="110" y1="104" x2="110" y2="124"/>
      <line x1="138" y1="104" x2="138" y2="116"/>
      <line x1="166" y1="104" x2="166" y2="116"/>
      <line x1="194" y1="104" x2="194" y2="124"/>
      <line x1="222" y1="104" x2="222" y2="116"/>
      <line x1="250" y1="104" x2="250" y2="116"/>
      <line x1="278" y1="104" x2="278" y2="124"/>
      <line x1="306" y1="104" x2="306" y2="116"/>
      <line x1="334" y1="104" x2="334" y2="116"/>
      <line x1="362" y1="104" x2="362" y2="124"/>
      <line x1="390" y1="104" x2="390" y2="116"/>
    </g>
  </g>

  <!-- forearm -->
  <path d="M80 196 C 130 178, 300 178, 420 186 C 442 188, 442 224, 420 226 C 300 234, 130 234, 80 218 Z" fill="#f6ded0" stroke="#e6c6b3" stroke-width="2"/>
  <!-- tattoo design on skin -->
  <g stroke="#1e293b" stroke-width="2.4" fill="none" stroke-linecap="round">
    <circle cx="250" cy="206" r="16"/>
    <path d="M250 190 l6 -12 M250 222 l-6 12 M234 206 l-12 -5 M266 206 l12 5"/>
  </g>
</svg>
