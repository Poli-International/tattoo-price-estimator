<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 281" width="500" height="281" role="img" aria-label="Choosing a tattoo style and complexity level with design swatches and a machine">
  <defs>
    <linearGradient id="stbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef3fa"/>
    </linearGradient>
  </defs>
  <rect width="500" height="281" rx="14" fill="url(#stbg)"/>
  <rect x="0.5" y="0.5" width="499" height="280" rx="13.5" fill="none" stroke="#dbe4f0"/>

  <text x="40" y="42" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#3b82f6">STEP 2</text>
  <text x="460" y="42" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Choose style</text>

  <!-- style swatch: fine line -->
  <g>
    <rect x="34" y="60" width="120" height="120" rx="10" fill="#ffffff" stroke="#cfd9e6"/>
    <g stroke="#1e293b" stroke-width="2.4" fill="none" stroke-linecap="round">
      <circle cx="94" cy="106" r="14"/>
      <path d="M94 92 c 10 4, 10 24, 0 28 c -10 -4, -10 -24, 0 -28"/>
      <path d="M94 120 l0 26 M94 132 l-12 -8 M94 140 l12 -8"/>
    </g>
    <text x="94" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">FINE LINE</text>
  </g>

  <!-- style swatch: geometric -->
  <g>
    <rect x="166" y="60" width="120" height="120" rx="10" fill="#ffffff" stroke="#cfd9e6"/>
    <g stroke="#3b82f6" stroke-width="2.4" fill="none">
      <polygon points="226,86 252,130 200,130"/>
      <circle cx="226" cy="122" r="18"/>
    </g>
    <text x="226" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">GEOMETRIC</text>
  </g>

  <!-- tattoo machine -->
  <g transform="translate(322 74)">
    <rect x="0" y="0" width="150" height="106" rx="10" fill="#ffffff" stroke="#cfd9e6"/>
    <rect x="34" y="20" width="46" height="26" rx="5" fill="#1e293b"/>
    <rect x="78" y="26" width="30" height="14" rx="3" fill="#3b82f6"/>
    <line x1="108" y1="33" x2="132" y2="33" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <line x1="52" y1="46" x2="52" y2="84" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="52" cy="88" r="3" fill="#3b82f6"/>
    <text x="75" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">MACHINE</text>
  </g>

  <!-- complexity meter -->
  <g transform="translate(34 218)">
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Complexity</text>
    <rect x="96" y="8" width="20" height="16" rx="3" fill="#3b82f6"/>
    <rect x="122" y="4" width="20" height="20" rx="3" fill="#3b82f6"/>
    <rect x="148" y="0" width="20" height="24" rx="3" fill="#3b82f6"/>
    <rect x="174" y="-4" width="20" height="28" rx="3" fill="#cbd5e1"/>
    <rect x="200" y="-8" width="20" height="32" rx="3" fill="#cbd5e1"/>
  </g>
</svg>
