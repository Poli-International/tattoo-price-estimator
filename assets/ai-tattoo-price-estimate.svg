<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 281" width="500" height="281" role="img" aria-label="AI-powered tattoo price estimate shown on a summary card">
  <defs>
    <linearGradient id="esbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef3fa"/>
    </linearGradient>
  </defs>
  <rect width="500" height="281" rx="14" fill="url(#esbg)"/>
  <rect x="0.5" y="0.5" width="499" height="280" rx="13.5" fill="none" stroke="#dbe4f0"/>

  <text x="40" y="42" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#3b82f6">STEP 4</text>
  <text x="460" y="42" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Your estimate</text>

  <!-- estimate card -->
  <g>
    <rect x="90" y="66" width="320" height="150" rx="12" fill="#ffffff" stroke="#cfd9e6"/>
    <rect x="90" y="66" width="320" height="40" rx="12" fill="#3b82f6"/>
    <rect x="90" y="94" width="320" height="12" fill="#3b82f6"/>
    <!-- AI sparkle -->
    <g transform="translate(114 78)" fill="#ffffff">
      <path d="M8 0 l2.4 5.6 l5.6 2.4 l-5.6 2.4 l-2.4 5.6 l-2.4 -5.6 l-5.6 -2.4 l5.6 -2.4 Z"/>
      <circle cx="20" cy="3" r="2"/>
    </g>
    <text x="146" y="92" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff">AI PRICE ESTIMATE</text>

    <text x="250" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#0f172a">$320 &#8211; $480</text>
    <text x="250" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Estimated studio price range</text>

    <!-- confidence bar -->
    <rect x="130" y="196" width="240" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="130" y="196" width="176" height="8" rx="4" fill="#10b981"/>
  </g>

  <g transform="translate(96 236)">
    <circle cx="8" cy="0" r="10" fill="#10b981"/>
    <path d="M3.5 0 l3 3 l6 -6" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="26" y="4" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">Instant, based on size, style, placement and colour.</text>
  </g>
</svg>
